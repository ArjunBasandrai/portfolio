<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 696 596.9" width="696" height="596.9"><title>Prediction request path</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
.cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
.cx text.m { font-family: var(--font-mono); }
.cx .t-ink { fill: var(--ink); }
.cx .t-soft { fill: var(--ink-soft); }
.cx .t-mute { fill: var(--muted); }
.cx .t-hero { fill: var(--accent-ink); }
.cx .t-warn { fill: var(--warn-ink); }
.cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
.cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
.cx .grid { stroke: var(--line); stroke-width: 1; }
.cx .axis { stroke: var(--line-strong); stroke-width: 1; }
.cx .brk { stroke: var(--muted); stroke-width: 1.2; }
.cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
.cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
.cx .c-hero { --c: var(--accent-ink); }
.cx .c-a { --c: var(--ink-soft); }
.cx .c-b { --c: var(--st-done); }
.cx .c-c { --c: var(--st-archive); }
.cx .c-d { --c: var(--muted); }
.cx .c-warn { --c: var(--st-progress); }
.cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
.cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
.cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
.cx .c-r4 { --c: var(--accent-ink); }
.cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
.cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.cx .bar { stroke: none; }
.cx .b-a { fill: var(--faint); }
.cx .b-hero { fill: var(--accent); }
.cx .b-warn { fill: var(--st-progress); }
.cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
.cx .b-track { fill: var(--line); }
.cx .b-q0 { fill: var(--ink-soft); }
.cx .b-q1 { fill: var(--st-done); }
.cx .b-q2 { fill: var(--accent); }
.cx .b-q3 { fill: var(--st-progress); }
.cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
.cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
.cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
.cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
.cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
.cx .nd-dash { stroke-dasharray: 4 3; }
.cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
.cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cx .cn.arw-dash { stroke-dasharray: 4 3; }
.cx .cn.arw-hero { stroke: var(--accent-ink); }
.cx .ah { fill: var(--muted); stroke: none; }
.cx .ah.arw-hero { fill: var(--accent-ink); }</style><text class="h-title" x="20" y="34.45" font-size="17">Prediction request path</text><svg class="cx" x="20" y="66.4" width="656" height="510.5" viewBox="0 0 656 510.5" aria-hidden="true" focusable="false"><rect x="0" y="0" width="210" height="30" rx="5" class="nd nd-hero"/><text x="105" y="18.84" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">POST /predict</text><path d="M105 30L105 39" class="cn arw"/><polygon points="105,43 102.25,38 107.75,38" class="ah arw"/><rect x="0" y="58" width="210" height="30" rx="5" class="nd nd-std"/><text x="105" y="76.84" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">Request validation</text><line x1="220" y1="45" x2="220" y2="101" class="brk"/><text x="232" y="54" font-size="11.5" text-anchor="start" class="t-soft">10 MiB max upload</text><text x="232" y="69" font-size="11.5" text-anchor="start" class="t-soft">4096 × 4096 max dimensions</text><text x="232" y="84" font-size="11.5" text-anchor="start" class="t-soft">JPEG, PNG, or WebP</text><text x="232" y="99" font-size="11.5" text-anchor="start" class="t-soft">animated images rejected</text><path d="M105 88L105 112" class="cn arw"/><polygon points="105,116 102.25,111 107.75,111" class="ah arw"/><rect x="0" y="116" width="210" height="30" rx="5" class="nd nd-std"/><text x="105" y="134.84" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">Image decode</text><path d="M105 146L105 155" class="cn arw"/><polygon points="105,159 102.25,154 107.75,154" class="ah arw"/><rect x="0" y="159" width="210" height="30" rx="5" class="nd nd-std"/><text x="105" y="177.84" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">Preprocess to 224 × 224</text><path d="M105 189L105 198" class="cn arw"/><polygon points="105,202 102.25,197 107.75,197" class="ah arw"/><rect x="0" y="202" width="210" height="59.5" rx="5" class="nd nd-std"/><text x="105" y="220.84" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">Bounded inference</text><text x="105" y="235.84" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">concurrency</text><text x="105" y="251.57" font-size="10.5" text-anchor="middle" class="t-mute">thread pool</text><path d="M105 261.5L105 270.5" class="cn arw"/><polygon points="105,274.5 102.25,269.5 107.75,269.5" class="ah arw"/><rect x="0" y="274.5" width="210" height="45" rx="5" class="nd nd-hero"/><text x="105" y="293.34" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">ONNX Runtime FP32</text><text x="105" y="308.34" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">CPU</text><path d="M105 319.5L105 328.5" class="cn arw"/><polygon points="105,332.5 102.25,327.5 107.75,327.5" class="ah arw"/><rect x="0" y="332.5" width="210" height="30" rx="5" class="nd nd-std"/><text x="105" y="351.34" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">Logits to probabilities</text><path d="M105 362.5L105 371.5" class="cn arw"/><polygon points="105,375.5 102.25,370.5 107.75,370.5" class="ah arw"/><rect x="0" y="390.5" width="210" height="30" rx="5" class="nd nd-std"/><text x="105" y="409.34" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">Confidence filter</text><line x1="220" y1="377.5" x2="220" y2="433.5" class="brk"/><text x="232" y="386.5" font-size="11.5" text-anchor="start" class="t-soft">top-1 at or below 0.50: return []</text><text x="232" y="401.5" font-size="11.5" text-anchor="start" class="t-soft">otherwise sort descending</text><text x="232" y="416.5" font-size="11.5" text-anchor="start" class="t-soft">stop at cumulative 0.90</text><text x="232" y="431.5" font-size="11.5" text-anchor="start" class="t-soft">return at most 5</text><path d="M105 420.5L105 444.5" class="cn arw"/><polygon points="105,448.5 102.25,443.5 107.75,443.5" class="ah arw"/><rect x="0" y="463.5" width="210" height="30" rx="5" class="nd nd-std"/><text x="105" y="482.34" font-size="12" text-anchor="middle" font-weight="600" class="t-ink">JSON response</text><line x1="220" y1="450.5" x2="220" y2="506.5" class="brk"/><text x="232" y="459.5" font-size="11.5" text-anchor="start" class="t-soft">common name</text><text x="232" y="474.5" font-size="11.5" text-anchor="start" class="t-soft">scientific name</text><text x="232" y="489.5" font-size="11.5" text-anchor="start" class="t-soft">taxon ID</text><text x="232" y="504.5" font-size="11.5" text-anchor="start" class="t-soft">confidence</text><rect x="470" y="209.75" width="186" height="44.5" rx="5" class="nd nd-mute nd-dash"/><text x="563" y="228.59" font-size="12" text-anchor="middle" font-weight="600" class="t-mute">Metrics and logging</text><text x="563" y="244.59" font-size="10.5" text-anchor="middle" class="t-mute">Prometheus counters, request logs</text><path d="M212 231.75L464 231.75" class="cn arw arw-dash"/><polygon points="468,231.75 463,234.5 463,229" class="ah arw arw-dash"/><text x="340" y="223.75" font-size="10.5" text-anchor="middle" class="t-mute m">side path</text></svg></svg>