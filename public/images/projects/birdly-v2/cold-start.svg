<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 696 262.4" width="696" height="262.4"><title>Cloud Run cold start</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
.cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
.cx text.m { font-family: var(--font-mono); }
.cx .t-ink { fill: var(--ink); }
.cx .t-soft { fill: var(--ink-soft); }
.cx .t-mute { fill: var(--muted); }
.cx .t-hero { fill: var(--accent-ink); }
.cx .t-warn { fill: var(--warn-ink); }
.cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
.cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
.cx .grid { stroke: var(--line); stroke-width: 1; }
.cx .axis { stroke: var(--line-strong); stroke-width: 1; }
.cx .brk { stroke: var(--muted); stroke-width: 1.2; }
.cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
.cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
.cx .c-hero { --c: var(--accent-ink); }
.cx .c-a { --c: var(--ink-soft); }
.cx .c-b { --c: var(--st-done); }
.cx .c-c { --c: var(--st-archive); }
.cx .c-d { --c: var(--muted); }
.cx .c-warn { --c: var(--st-progress); }
.cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
.cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
.cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
.cx .c-r4 { --c: var(--accent-ink); }
.cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
.cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.cx .bar { stroke: none; }
.cx .b-a { fill: var(--faint); }
.cx .b-hero { fill: var(--accent); }
.cx .b-warn { fill: var(--st-progress); }
.cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
.cx .b-track { fill: var(--line); }
.cx .b-q0 { fill: var(--ink-soft); }
.cx .b-q1 { fill: var(--st-done); }
.cx .b-q2 { fill: var(--accent); }
.cx .b-q3 { fill: var(--st-progress); }
.cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
.cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
.cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
.cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
.cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
.cx .nd-dash { stroke-dasharray: 4 3; }
.cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
.cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cx .cn.arw-dash { stroke-dasharray: 4 3; }
.cx .cn.arw-hero { stroke: var(--accent-ink); }
.cx .ah { fill: var(--muted); stroke: none; }
.cx .ah.arw-hero { fill: var(--accent-ink); }</style><text class="h-title" x="20" y="34.45" font-size="17">Cloud Run cold start</text><text class="h-sub" x="20" y="56.400000000000006" font-size="11">/health request from my laptop, warm instance vs after scale-to-zero</text><svg class="cx" x="20" y="66.4" width="656" height="176" viewBox="0 0 656 176" aria-hidden="true" focusable="false"><text x="0" y="50" font-size="13" text-anchor="start" font-weight="600" class="t-ink">Warm /health</text><text x="0" y="66" font-size="11.5" text-anchor="start" class="t-mute">instance already running</text><rect x="214" y="34" width="10.28" height="30" rx="2" class="bar b-hero"/><text x="236.28" y="58" font-size="24" text-anchor="start" font-weight="700" class="t-ink m">202 ms</text><text x="0" y="116" font-size="13" text-anchor="start" font-weight="600" class="t-ink">Cold /health</text><text x="0" y="132" font-size="11.5" text-anchor="start" class="t-mute">after scale-to-zero</text><rect x="214" y="100" width="330" height="30" rx="2" class="bar b-warn"/><text x="556" y="124" font-size="24" text-anchor="start" font-weight="700" class="t-ink m">6.48 s</text><line x1="224.28" y1="146" x2="544" y2="146" class="brk"/><line x1="224.28" y1="141" x2="224.28" y2="151" class="brk"/><line x1="544" y1="141" x2="544" y2="151" class="brk"/><text x="384.14" y="168" font-size="12" text-anchor="middle" class="t-soft">about 6.28 s of cold-start overhead</text></svg></svg>