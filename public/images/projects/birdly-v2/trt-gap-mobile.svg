<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 328 400.6" width="328" height="400.6">
  <title>TensorRT FP16: model-only vs end-to-end throughput</title>

  <style>
    svg.cx{
      --paper:#faf8f5;
      --paper-2:#f0ebe5;
      --surface:#fffdfb;
      --ink:#3d3930;
      --ink-soft:#6b6459;
      --muted:#8b8278;
      --faint:#b8b1a5;
      --line:#e8e2d9;
      --line-strong:#ddd6cd;
      --accent:#8b9556;
      --accent-ink:#6d7644;
      --accent-soft:#f0f3e6;
      --st-progress:#c9a566;
      --st-done:#6b8fa3;
      --st-archive:#9a8a7a;
      --warn-ink:#8a5f17;
      --font-sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --font-serif:"Newsreader",Georgia,"Times New Roman",serif;
      --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace
    }

    @media (prefers-color-scheme:dark){
      svg.cx{
        --paper:#1f1a24;
        --paper-2:#2a2430;
        --surface:#2e2836;
        --ink:#f5f1ed;
        --ink-soft:#ddd5cd;
        --muted:#b8aea3;
        --faint:#7a7268;
        --line:#3d3847;
        --line-strong:#4a4451;
        --accent:#a8c75d;
        --accent-ink:#b8d76f;
        --accent-soft:#4a5228;
        --st-progress:#d4ba7a;
        --st-done:#7fa3bb;
        --st-archive:#a89a8a;
        --warn-ink:#e3c98c
      }
    }

    .cx{overflow:visible}
    .cx text{font-family:var(--font-sans);fill:var(--ink-soft)}
    .cx text.m{font-family:var(--font-mono)}
    .cx .t-ink{fill:var(--ink)}
    .cx .t-soft{fill:var(--ink-soft)}
    .cx .t-mute{fill:var(--muted)}
    .cx .t-hero{fill:var(--accent-ink)}
    .cx .t-warn{fill:var(--warn-ink)}
    .cx text.h-title{font-family:var(--font-serif);fill:var(--ink)}
    .cx text.h-sub{font-family:var(--font-mono);fill:var(--muted)}
    .cx .grid{stroke:var(--line);stroke-width:1}
    .cx .axis{stroke:var(--line-strong);stroke-width:1}
    .cx .brk{stroke:var(--muted);stroke-width:1.2}
    .cx .hl{fill:color-mix(in oklch,var(--accent-soft) 65%,transparent)}
    .cx .gapfill{fill:color-mix(in oklch,var(--accent-ink) 13%,transparent)}
    .cx .c-hero{--c:var(--accent-ink)}
    .cx .c-a{--c:var(--ink-soft)}
    .cx .c-b{--c:var(--st-done)}
    .cx .c-c{--c:var(--st-archive)}
    .cx .c-d{--c:var(--muted)}
    .cx .c-warn{--c:var(--st-progress)}
    .cx .c-r1{--c:color-mix(in oklch,var(--accent-ink) 22%,var(--faint))}
    .cx .c-r2{--c:color-mix(in oklch,var(--accent-ink) 45%,var(--faint))}
    .cx .c-r3{--c:color-mix(in oklch,var(--accent-ink) 72%,var(--faint))}
    .cx .c-r4{--c:var(--accent-ink)}
    .cx .ln{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round}
    .cx .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
    .cx .bar{stroke:none}
    .cx .b-a{fill:var(--faint)}
    .cx .b-hero{fill:var(--accent)}
    .cx .b-warn{fill:var(--st-progress)}
    .cx .b-int8{stroke:var(--st-progress);stroke-width:1.3}
    .cx .b-track{fill:var(--line)}
    .cx .b-q0{fill:var(--ink-soft)}
    .cx .b-q1{fill:var(--st-done)}
    .cx .b-q2{fill:var(--accent)}
    .cx .b-q3{fill:var(--st-progress)}
    .cx .hatch{stroke:var(--st-progress);stroke-width:1.4}
    .cx .nd{fill:var(--paper);stroke:var(--line-strong);stroke-width:1}
    .cx .nd-hero{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:1.3}
    .cx .nd-warn{fill:color-mix(in oklch,var(--st-progress) 14%,var(--paper));stroke:var(--st-progress);stroke-width:1.3}
    .cx .nd-mute{fill:transparent;stroke-dasharray:4 3}
    .cx .nd-dash{stroke-dasharray:4 3}
    .cx .grp{fill:color-mix(in oklch,var(--paper-2) 55%,transparent);stroke:var(--line);stroke-width:1}
    .cx .cn{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .cx .cn.arw-dash{stroke-dasharray:4 3}
    .cx .cn.arw-hero{stroke:var(--accent-ink)}
    .cx .ah{fill:var(--muted);stroke:none}
    .cx .ah.arw-hero{fill:var(--accent-ink)}
  </style>

  <text class="h-title" x="14" y="27.175" font-size="15.5">TensorRT FP16: model-only</text>
  <text class="h-title" x="14" y="47.175" font-size="15.5">vs end-to-end throughput</text>

  <text class="h-sub" x="14" y="66.6" font-size="10">RTX 3050 Laptop GPU. End-to-end</text>
  <text class="h-sub" x="14" y="80.6" font-size="10">includes decoding and preprocessing.</text>

  <svg class="cx" x="14" y="90.6" width="300" height="296" viewBox="0 0 300 296" aria-hidden="true" focusable="false">

    <path d="M38 170.46L88.4 139.23L138.8 115.65L189.2 98.9L239.6 85.11L290 57.51L290 200.51L239.6 200.91L189.2 201.34L138.8 201.29L88.4 202.1L38 205.35Z" class="gapfill"/>

    <line x1="38" y1="228" x2="290" y2="228" class="axis"/>
    <text x="30" y="231.68" font-size="10.5" text-anchor="end" class="t-mute m">0</text>

    <line x1="38" y1="181.33" x2="290" y2="181.33" class="grid"/>
    <text x="30" y="185.01" font-size="10.5" text-anchor="end" class="t-mute m">200</text>

    <line x1="38" y1="134.67" x2="290" y2="134.67" class="grid"/>
    <text x="30" y="138.34" font-size="10.5" text-anchor="end" class="t-mute m">400</text>

    <line x1="38" y1="88" x2="290" y2="88" class="grid"/>
    <text x="30" y="91.68" font-size="10.5" text-anchor="end" class="t-mute m">600</text>

    <line x1="38" y1="41.33" x2="290" y2="41.33" class="grid"/>
    <text x="30" y="45.01" font-size="10.5" text-anchor="end" class="t-mute m">800</text>

    <text x="38" y="247.5" font-size="10.5" text-anchor="middle" class="t-mute m">1</text>
    <text x="88.4" y="247.5" font-size="10.5" text-anchor="middle" class="t-mute m">2</text>
    <text x="138.8" y="247.5" font-size="10.5" text-anchor="middle" class="t-mute m">4</text>
    <text x="189.2" y="247.5" font-size="10.5" text-anchor="middle" class="t-mute m">8</text>
    <text x="239.6" y="247.5" font-size="10.5" text-anchor="middle" class="t-mute m">16</text>
    <text x="290" y="247.5" font-size="10.5" text-anchor="middle" class="t-mute m">32</text>

    <text x="38" y="18" font-size="10.5" text-anchor="start" class="t-mute">Images / second, TensorRT FP16</text>

    <path d="M38 205.35L88.4 202.1L138.8 201.29L189.2 201.34L239.6 200.91L290 200.51" class="ln c-a" stroke-width="2.2"/>

    <circle cx="38" cy="205.35" r="3.8" class="dot c-a"/>
    <circle cx="88.4" cy="202.1" r="3.8" class="dot c-a"/>
    <circle cx="138.8" cy="201.29" r="3.8" class="dot c-a"/>
    <circle cx="189.2" cy="201.34" r="3.8" class="dot c-a"/>
    <circle cx="239.6" cy="200.91" r="3.8" class="dot c-a"/>
    <circle cx="290" cy="200.51" r="3.8" class="dot c-a"/>

    <path d="M38 170.46L88.4 139.23L138.8 115.65L189.2 98.9L239.6 85.11L290 57.51" class="ln c-hero" stroke-width="3"/>

    <circle cx="38" cy="170.46" r="4.6" class="dot c-hero"/>
    <circle cx="88.4" cy="139.23" r="4.6" class="dot c-hero"/>
    <circle cx="138.8" cy="115.65" r="4.6" class="dot c-hero"/>
    <circle cx="189.2" cy="98.9" r="4.6" class="dot c-hero"/>
    <circle cx="239.6" cy="85.11" r="4.6" class="dot c-hero"/>
    <circle cx="290" cy="57.51" r="4.6" class="dot c-hero"/>

    <text x="282" y="45.51" font-size="12" text-anchor="end" font-weight="700" class="t-hero m">730.66</text>
    <text x="282" y="189.51" font-size="12" text-anchor="end" font-weight="700" class="t-soft m">117.81</text>

    <text x="138.8" y="185.17" font-size="10.5" text-anchor="middle" class="t-mute m">≈ 115–118 img/s from batch 4</text>

    <text x="290" y="29.51" font-size="10.5" text-anchor="end" font-weight="600" class="t-hero">Model only</text>
    <text x="290" y="217.51" font-size="10.5" text-anchor="end" class="t-soft">End to end</text>

    <text x="164" y="274.5" font-size="10.5" text-anchor="middle" class="t-mute">Batch size</text>

  </svg>
</svg>