<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 328 899.6" width="328" height="899.6">
  <title>System architecture</title>

  <style>
    svg.cx{
      --paper:#faf8f5;
      --paper-2:#f0ebe5;
      --surface:#fffdfb;
      --ink:#3d3930;
      --ink-soft:#6b6459;
      --muted:#8b8278;
      --faint:#b8b1a5;
      --line:#e8e2d9;
      --line-strong:#ddd6cd;
      --accent:#8b9556;
      --accent-ink:#6d7644;
      --accent-soft:#f0f3e6;
      --st-progress:#c9a566;
      --st-done:#6b8fa3;
      --st-archive:#9a8a7a;
      --warn-ink:#8a5f17;
      --font-sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --font-serif:"Newsreader",Georgia,"Times New Roman",serif;
      --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace
    }

    @media (prefers-color-scheme:dark){
      svg.cx{
        --paper:#1f1a24;
        --paper-2:#2a2430;
        --surface:#2e2836;
        --ink:#f5f1ed;
        --ink-soft:#ddd5cd;
        --muted:#b8aea3;
        --faint:#7a7268;
        --line:#3d3847;
        --line-strong:#4a4451;
        --accent:#a8c75d;
        --accent-ink:#b8d76f;
        --accent-soft:#4a5228;
        --st-progress:#d4ba7a;
        --st-done:#7fa3bb;
        --st-archive:#a89a8a;
        --warn-ink:#e3c98c
      }
    }

    .cx{overflow:visible}
    .cx text{font-family:var(--font-sans);fill:var(--ink-soft)}
    .cx text.m{font-family:var(--font-mono)}
    .cx .t-ink{fill:var(--ink)}
    .cx .t-soft{fill:var(--ink-soft)}
    .cx .t-mute{fill:var(--muted)}
    .cx .t-hero{fill:var(--accent-ink)}
    .cx .t-warn{fill:var(--warn-ink)}
    .cx text.h-title{font-family:var(--font-serif);fill:var(--ink)}
    .cx text.h-sub{font-family:var(--font-mono);fill:var(--muted)}
    .cx .grid{stroke:var(--line);stroke-width:1}
    .cx .axis{stroke:var(--line-strong);stroke-width:1}
    .cx .brk{stroke:var(--muted);stroke-width:1.2}
    .cx .hl{fill:color-mix(in oklch,var(--accent-soft) 65%,transparent)}
    .cx .gapfill{fill:color-mix(in oklch,var(--accent-ink) 13%,transparent)}
    .cx .c-hero{--c:var(--accent-ink)}
    .cx .c-a{--c:var(--ink-soft)}
    .cx .c-b{--c:var(--st-done)}
    .cx .c-c{--c:var(--st-archive)}
    .cx .c-d{--c:var(--muted)}
    .cx .c-warn{--c:var(--st-progress)}
    .cx .c-r1{--c:color-mix(in oklch,var(--accent-ink) 22%,var(--faint))}
    .cx .c-r2{--c:color-mix(in oklch,var(--accent-ink) 45%,var(--faint))}
    .cx .c-r3{--c:color-mix(in oklch,var(--accent-ink) 72%,var(--faint))}
    .cx .c-r4{--c:var(--accent-ink)}
    .cx .ln{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round}
    .cx .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
    .cx .bar{stroke:none}
    .cx .b-a{fill:var(--faint)}
    .cx .b-hero{fill:var(--accent)}
    .cx .b-warn{fill:var(--st-progress)}
    .cx .b-int8{stroke:var(--st-progress);stroke-width:1.3}
    .cx .b-track{fill:var(--line)}
    .cx .b-q0{fill:var(--ink-soft)}
    .cx .b-q1{fill:var(--st-done)}
    .cx .b-q2{fill:var(--accent)}
    .cx .b-q3{fill:var(--st-progress)}
    .cx .hatch{stroke:var(--st-progress);stroke-width:1.4}
    .cx .nd{fill:var(--paper);stroke:var(--line-strong);stroke-width:1}
    .cx .nd-hero{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:1.3}
    .cx .nd-warn{fill:color-mix(in oklch,var(--st-progress) 14%,var(--paper));stroke:var(--st-progress);stroke-width:1.3}
    .cx .nd-mute{fill:transparent;stroke-dasharray:4 3}
    .cx .nd-dash{stroke-dasharray:4 3}
    .cx .grp{fill:color-mix(in oklch,var(--paper-2) 55%,transparent);stroke:var(--line);stroke-width:1}
    .cx .cn{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .cx .cn.arw-dash{stroke-dasharray:4 3}
    .cx .cn.arw-hero{stroke:var(--accent-ink)}
    .cx .ah{fill:var(--muted);stroke:none}
    .cx .ah.arw-hero{fill:var(--accent-ink)}
  </style>

  <text class="h-title" x="14" y="43.175" font-size="15.5">System architecture</text>

  <svg class="cx" x="14" y="70.6" width="300" height="815" viewBox="0 0 300 815" aria-hidden="true" focusable="false">

    <text x="0" y="10" font-size="10.5" text-anchor="start" class="t-mute m">Data and training</text>

    <rect x="20" y="18" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="36.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">iNaturalist Open Data</text>

    <path d="M150 47L150 54.5" class="cn arw"/>
    <polygon points="150,58 147.53,53.5 152.48,53.5" class="ah arw"/>

    <rect x="20" y="58" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="76.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Polars + DVC pipeline</text>

    <path d="M150 87L150 94.5" class="cn arw"/>
    <polygon points="150,98 147.53,93.5 152.48,93.5" class="ah arw"/>

    <rect x="20" y="98" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="116.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Validated manifest</text>

    <path d="M150 127L150 134.5" class="cn arw"/>
    <polygon points="150,138 147.53,133.5 152.48,133.5" class="ah arw"/>

    <rect x="20" y="138" width="260" height="42.5" rx="5" class="nd nd-std"/>
    <text x="150" y="156.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">PyTorch training</text>
    <text x="150" y="170.75" font-size="9.5" text-anchor="middle" class="t-mute">runs tracked in MLflow</text>

    <path d="M150 180.5L150 188" class="cn arw"/>
    <polygon points="150,191.5 147.53,187 152.48,187" class="ah arw"/>

    <rect x="20" y="191.5" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="209.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">ConvNeXt-Tiny checkpoint</text>

    <rect x="0" y="246.5" width="142" height="204.5" rx="8" class="grp"/>
    <text x="12" y="263.5" font-size="10" text-anchor="start" class="t-mute m">CPU benchmarks</text>

    <rect x="8" y="272.5" width="126" height="28" rx="5" class="nd nd-std"/>
    <text x="71" y="289.7" font-size="10" text-anchor="middle" font-weight="600" class="t-ink">PyTorch eager</text>

    <rect x="8" y="306.5" width="126" height="28" rx="5" class="nd nd-std"/>
    <text x="71" y="323.7" font-size="10" text-anchor="middle" font-weight="600" class="t-ink">torch.compile</text>

    <rect x="8" y="340.5" width="126" height="40.5" rx="5" class="nd nd-std"/>
    <text x="71" y="364.3" font-size="10" text-anchor="middle" font-weight="600" class="t-ink">ONNX Runtime INT8</text>

    <rect x="8" y="387" width="126" height="40.5" rx="5" class="nd nd-hero"/>
    <text x="71" y="411.0" font-size="10" text-anchor="middle" font-weight="600" class="t-ink">ONNX Runtime FP32</text>

    <rect x="158" y="246.5" width="142" height="204.5" rx="8" class="grp"/>
    <text x="170" y="263.5" font-size="10" text-anchor="start" class="t-mute m">GPU benchmarks</text>

    <rect x="166" y="272.5" width="126" height="28" rx="5" class="nd nd-std"/>
    <text x="229" y="289.7" font-size="10" text-anchor="middle" font-weight="600" class="t-ink">PyTorch FP32</text>

    <rect x="166" y="306.5" width="126" height="28" rx="5" class="nd nd-std"/>
    <text x="229" y="323.7" font-size="10" text-anchor="middle" font-weight="600" class="t-ink">PyTorch FP16</text>

    <rect x="166" y="340.5" width="126" height="40.5" rx="5" class="nd nd-std"/>
    <text x="229" y="364.3" font-size="10" text-anchor="middle" font-weight="600" class="t-ink">ONNX Runtime CUDA</text>

    <rect x="166" y="387" width="126" height="52" rx="5" class="nd nd-warn"/>
    <text x="229" y="416.3" font-size="10" text-anchor="middle" font-weight="600" class="t-ink">TensorRT FP16</text>

    <path d="M150 220.5L150 234.5L229 234.5L229 241" class="cn arw"/>
    <polygon points="229,245.5 225.98,240 232.03,240" class="ah arw"/>

    <path d="M150 234.5L71 234.5L71 241" class="cn arw"/>
    <polygon points="71,245.5 67.97,240 74.03,240" class="ah arw"/>

    <text x="0" y="483" font-size="10.5" text-anchor="start" class="t-mute m">Deployed request path</text>

    <rect x="20" y="491" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="509.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Browser</text>

    <path d="M150 520L150 527.5" class="cn arw"/>
    <polygon points="150,531 147.53,526.5 152.48,526.5" class="ah arw"/>

    <rect x="20" y="531" width="260" height="42.5" rx="5" class="nd nd-std"/>
    <text x="150" y="549.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Next.js frontend</text>
    <text x="150" y="563.75" font-size="9.5" text-anchor="middle" class="t-mute">Vercel</text>

    <path d="M150 573.5L150 580.5" class="cn arw"/>
    <polygon points="150,584.5 147.25,579.5 152.75,579.5" class="ah arw"/>

    <rect x="0" y="584.5" width="300" height="162.5" rx="8" class="grp"/>
    <text x="12" y="601.5" font-size="10.5" text-anchor="start" class="t-mute m">Google Cloud Run</text>

    <rect x="20" y="610.5" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="628.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">FastAPI container</text>

    <path d="M150 639.5L150 647" class="cn arw"/>
    <polygon points="150,650.5 147.53,646 152.48,646" class="ah arw"/>

    <rect x="20" y="650.5" width="260" height="42.5" rx="5" class="nd nd-hero"/>
    <text x="150" y="668.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">ONNX Runtime FP32 CPU</text>
    <text x="150" y="683.25" font-size="9.5" text-anchor="middle" class="t-mute">same model as the CPU benchmark</text>

    <path d="M150 693L150 700.5" class="cn arw"/>
    <polygon points="150,704 147.53,699.5 152.48,699.5" class="ah arw"/>

    <rect x="20" y="704" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="722.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Model prediction</text>

    <rect x="0" y="765" width="14" height="10" rx="2" class="nd nd-hero"/>
    <text x="20" y="774" font-size="10.5" text-anchor="start" class="t-mute">selected and deployed</text>

    <rect x="0" y="786" width="14" height="10" rx="2" class="nd nd-warn"/>
    <text x="20" y="795" font-size="10.5" text-anchor="start" class="t-mute">best GPU benchmark, not deployed</text>

  </svg>
</svg>