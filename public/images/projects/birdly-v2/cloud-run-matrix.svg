y2="418" class="axis"/><text x="32" y="422.03" font-size="11.5" text-anchor="end" class="t-mute m">0</text><line x1="40" y1="376.86" x2="272" y2="376.86" class="grid"/><text x="32" y="380.88" font-size="11.5" text-anchor="end" class="t-mute m">6</text><line x1="40" y1="335.71" x2="272" y2="335.71" class="grid"/><text x="32" y="339.74" font-size="11.5" text-anchor="end" class="t-mute m">12</text><text x="40" y="438.5" font-size="11.5" text-anchor="middle" class="t-mute m">1</text><text x="98" y="438.5" font-size="11.5" text-anchor="middle" class="t-mute m">2</text><text x="156" y="438.5" font-size="11.5" text-anchor="middle" class="t-mute m">4</text><text x="214" y="438.5" font-size="11.5" text-anchor="middle" class="t-mute m">8</text><text x="272" y="438.5" font-size="11.5" text-anchor="middle" class="t-mute m">16</text><text x="156" y="461" font-size="11.5" text-anchor="middle" class="t-mute">Virtual users</text><path d="M40 365.34L98 339.97L156 340.51L214 339.14L272 338.73" class="ln c-d" stroke-width="2" stroke-dasharray="5 3"/><path d="M40 365.41L98 339.9L156 335.78L214 335.71L272 339.07" class="ln c-hero" stroke-width="2.8"/><text x="282" y="342.76" font-size="11.5" text-anchor="start" class="t-soft">RC 4</text><text x="282" y="357.26" font-size="11.5" text-anchor="start" font-weight="600" class="t-hero">RC 16</text><text x="366" y="330" font-size="12" text-anchor="start" class="t-ink">RC 16 was barely better than RC 8:</text><text x="366" y="350" font-size="11.5" text-anchor="start" class="t-mute m">4 VUs   11.99 vs 11.30 requests/s</text><text x="366" y="368" font-size="11.5" text-anchor="start" class="t-mute m">8 VUs   12.00 vs 11.50 requests/s</text></svg><line x1="20" y1="542.4" x2="676" y2="542.4" class="grid"/><text class="h-sub" x="20" y="560.4" font-size="10.5">Cloud Run in us-east4: 2 vCPU, 2 GiB RAM, at most one instance, request concurrency 16.</text><text class="h-sub" x="20" y="575.4" font-size="10.5">30 s per virtual-user level. Rate limiting was disabled for the load tests.</text></svg>