<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 696 595.4" width="696" height="595.4"><title>Cloud Run serving matrix</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
.cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
.cx text.m { font-family: var(--font-mono); }
.cx .t-ink { fill: var(--ink); }
.cx .t-soft { fill: var(--ink-soft); }
.cx .t-mute { fill: var(--muted); }
.cx .t-hero { fill: var(--accent-ink); }
.cx .t-warn { fill: var(--warn-ink); }
.cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
.cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
.cx .grid { stroke: var(--line); stroke-width: 1; }
.cx .axis { stroke: var(--line-strong); stroke-width: 1; }
.cx .brk { stroke: var(--muted); stroke-width: 1.2; }
.cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
.cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
.cx .c-hero { --c: var(--accent-ink); }
.cx .c-a { --c: var(--ink-soft); }
.cx .c-b { --c: var(--st-done); }
.cx .c-c { --c: var(--st-archive); }
.cx .c-d { --c: var(--muted); }
.cx .c-warn { --c: var(--st-progress); }
.cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
.cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
.cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
.cx .c-r4 { --c: var(--accent-ink); }
.cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
.cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.cx .bar { stroke: none; }
.cx .b-a { fill: var(--faint); }
.cx .b-hero { fill: var(--accent); }
.cx .b-warn { fill: var(--st-progress); }
.cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
.cx .b-track { fill: var(--line); }
.cx .b-q0 { fill: var(--ink-soft); }
.cx .b-q1 { fill: var(--st-done); }
.cx .b-q2 { fill: var(--accent); }
.cx .b-q3 { fill: var(--st-progress); }
.cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
.cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
.cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
.cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
.cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
.cx .nd-dash { stroke-dasharray: 4 3; }
.cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
.cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cx .cn.arw-dash { stroke-dasharray: 4 3; }
.cx .cn.arw-hero { stroke: var(--accent-ink); }
.cx .ah { fill: var(--muted); stroke: none; }
.cx .ah.arw-hero { fill: var(--accent-ink); }</style><text class="h-title" x="20" y="34.45" font-size="17">Cloud Run serving matrix</text><text class="h-sub" x="20" y="56.400000000000006" font-size="11">T = ONNX threads, C = inference concurrency, RC = Cloud Run request concurrency. Selected: T2 C4 RC16.</text><svg class="cx" x="20" y="66.4" width="656" height="470" viewBox="0 0 656 470" aria-hidden="true" focusable="false"><line x1="40" y1="226" x2="272" y2="226" class="axis"/><text x="32" y="230.03" font-size="11.5" text-anchor="end" class="t-mute m">0</text><line x1="40" y1="171.71" x2="272" y2="171.71" class="grid"/><text x="32" y="175.74" font-size="11.5" text-anchor="end" class="t-mute m">4</text><line x1="40" y1="117.43" x2="272" y2="117.43" class="grid"/><text x="32" y="121.45" font-size="11.5" text-anchor="end" class="t-mute m">8</text><line x1="40" y1="63.14" x2="272" y2="63.14" class="grid"/><text x="32" y="67.17" font-size="11.5" text-anchor="end" class="t-mute m">12</text><text x="40" y="246.5" font-size="11.5" text-anchor="middle" class="t-mute m">1</text><text x="98" y="246.5" font-size="11.5" text-anchor="middle" class="t-mute m">2</text><text x="156" y="246.5" font-size="11.5" text-anchor="middle" class="t-mute m">4</text><text x="214" y="246.5" font-size="11.5" text-anchor="middle" class="t-mute m">8</text><text x="272" y="246.5" font-size="11.5" text-anchor="middle" class="t-mute m">16</text><text x="156" y="269" font-size="11.5" text-anchor="middle" class="t-mute">Virtual users</text><text x="40" y="22" font-size="11.5" text-anchor="start" class="t-mute">Requests / second</text><path d="M40 161.94L98 131.27L156 131.54L214 132.76L272 135.34" class="ln c-c" stroke-width="1.9"/><path d="M40 162.89L98 110.91L156 105.21L214 101.41L272 101.96" class="ln c-c" stroke-width="1.9" stroke-dasharray="5 3"/><path d="M40 129.78L98 72.37L156 71.01L214 71.15L272 73.19" class="ln c-b" stroke-width="1.9"/><path d="M40 152.31L98 100.87L156 101.01L214 105.76L272 105.76" class="ln c-b" stroke-width="1.9" stroke-dasharray="5 3"/><path d="M40 121.91L98 71.42L156 63.28L214 63.14L272 69.79" class="ln c-hero" stroke-width="3.2"/><circle cx="40" cy="121.91" r="4.800000000000001" class="dot c-hero"/><circle cx="98" cy="71.42" r="4.800000000000001" class="dot c-hero"/><circle cx="156" cy="63.28" r="4.800000000000001" class="dot c-hero"/><circle cx="214" cy="63.14" r="4.800000000000001" class="dot c-hero"/><circle cx="272" cy="69.79" r="4.800000000000001" class="dot c-hero"/><text x="282" y="139.37" font-size="11.5" text-anchor="start" class="t-soft">T1 C1</text><text x="282" y="105.98" font-size="11.5" text-anchor="start" class="t-soft">T1 C2</text><text x="282" y="88.32" font-size="11.5" text-anchor="start" class="t-soft">T2 C1</text><text x="282" y="120.48" font-size="11.5" text-anchor="start" class="t-soft">T2 C2</text><text x="282" y="73.82" font-size="11.5" text-anchor="start" font-weight="600" class="t-hero">T2 C4</text><line x1="366" y1="226" x2="598" y2="226" class="axis"/><text x="358" y="230.03" font-size="11.5" text-anchor="end" class="t-mute m">0</text><line x1="366" y1="188" x2="598" y2="188" class="grid"/><text x="358" y="192.03" font-size="11.5" text-anchor="end" class="t-mute m">500</text><line x1="366" y1="150" x2="598" y2="150" class="grid"/><text x="358" y="154.03" font-size="11.5" text-anchor="end" class="t-mute m">1000</text><line x1="366" y1="112" x2="598" y2="112" class="grid"/><text x="358" y="116.03" font-size="11.5" text-anchor="end" class="t-mute m">1500</text><line x1="366" y1="74" x2="598" y2="74" class="grid"/><text x="358" y="78.03" font-size="11.5" text-anchor="end" class="t-mute m">2000</text><line x1="366" y1="36" x2="598" y2="36" class="grid"/><text x="358" y="40.03" font-size="11.5" text-anchor="end" class="t-mute m">2500</text><text x="366" y="246.5" font-size="11.5" text-anchor="middle" class="t-mute m">1</text><text x="424" y="246.5" font-size="11.5" text-anchor="middle" class="t-mute m">2</text><