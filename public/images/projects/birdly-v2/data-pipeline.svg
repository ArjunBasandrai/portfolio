<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 696 387.9" width="696" height="387.9"><title>Data pipeline</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
.cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
.cx text.m { font-family: var(--font-mono); }
.cx .t-ink { fill: var(--ink); }
.cx .t-soft { fill: var(--ink-soft); }
.cx .t-mute { fill: var(--muted); }
.cx .t-hero { fill: var(--accent-ink); }
.cx .t-warn { fill: var(--warn-ink); }
.cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
.cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
.cx .grid { stroke: var(--line); stroke-width: 1; }
.cx .axis { stroke: var(--line-strong); stroke-width: 1; }
.cx .brk { stroke: var(--muted); stroke-width: 1.2; }
.cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
.cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
.cx .c-hero { --c: var(--accent-ink); }
.cx .c-a { --c: var(--ink-soft); }
.cx .c-b { --c: var(--st-done); }
.cx .c-c { --c: var(--st-archive); }
.cx .c-d { --c: var(--muted); }
.cx .c-warn { --c: var(--st-progress); }
.cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
.cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
.cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
.cx .c-r4 { --c: var(--accent-ink); }
.cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
.cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.cx .bar { stroke: none; }
.cx .b-a { fill: var(--faint); }
.cx .b-hero { fill: var(--accent); }
.cx .b-warn { fill: var(--st-progress); }
.cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
.cx .b-track { fill: var(--line); }
.cx .b-q0 { fill: var(--ink-soft); }
.cx .b-q1 { fill: var(--st-done); }
.cx .b-q2 { fill: var(--accent); }
.cx .b-q3 { fill: var(--st-progress); }
.cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
.cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
.cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
.cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
.cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
.cx .nd-dash { stroke-dasharray: 4 3; }
.cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
.cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cx .cn.arw-dash { stroke-dasharray: 4 3; }
.cx .cn.arw-hero { stroke: var(--accent-ink); }
.cx .ah { fill: var(--muted); stroke: none; }
.cx .ah.arw-hero { fill: var(--accent-ink); }</style><text class="h-title" x="20" y="34.45" font-size="17">Data pipeline</text><text class="h-sub" x="20" y="56.400000000000006" font-size="11">iNaturalist Open Data to a validated manifest</text><svg class="cx" x="20" y="66.4" width="656" height="301.5" viewBox="0 0 656 301.5" aria-hidden="true" focusable="false"><rect x="0" y="0" width="150" height="297.5" rx="8" class="grp"/><text x="12" y="17" font-size="10.5" text-anchor="start" class="t-mute m">iNaturalist Open Data</text><rect x="12" y="30" width="126" height="29.5" rx="5" class="nd nd-std"/><text x="75" y="48.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">observations.csv</text><path d="M75 59.5L75 65" class="cn arw"/><polygon points="75,68.5 72.53,64 77.47,64" class="ah arw"/><rect x="12" y="68.5" width="126" height="29.5" rx="5" class="nd nd-std"/><text x="75" y="86.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">photos.csv</text><path d="M75 98L75 103.5" class="cn arw"/><polygon points="75,107 72.53,102.5 77.47,102.5" class="ah arw"/><rect x="12" y="107" width="126" height="29.5" rx="5" class="nd nd-std"/><text x="75" y="125.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">taxa.csv</text><rect x="168" y="0" width="168" height="297.5" rx="8" class="grp"/><text x="180" y="17" font-size="10.5" text-anchor="start" class="t-mute m">Polars streaming</text><rect x="180" y="30" width="144" height="43.5" rx="5" class="nd nd-std"/><text x="252" y="48.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Taxonomy</text><text x="252" y="63.66" font-size="10" text-anchor="middle" class="t-mute">active bird species</text><path d="M252 73.5L252 79" class="cn arw"/><polygon points="252,82.5 249.53,78 254.48,78" class="ah arw"/><rect x="180" y="82.5" width="144" height="43.5" rx="5" class="nd nd-std"/><text x="252" y="100.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Research grade</text><text x="252" y="116.16" font-size="10" text-anchor="middle" class="t-mute">observations only</text><path d="M252 126L252 131.5" class="cn arw"/><polygon points="252,135 249.53,130.5 254.48,130.5" class="ah arw"/><rect x="180" y="135" width="144" height="43.5" rx="5" class="nd nd-std"/><text x="252" y="153.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">New York</text><text x="252" y="168.66" font-size="10" text-anchor="middle" class="t-mute">bounding box</text><path d="M252 178.5L252 184" class="cn arw"/><polygon points="252,187.5 249.53,183 254.48,183" class="ah arw"/><rect x="180" y="187.5" width="144" height="43.5" rx="5" class="nd nd-std"/><text x="252" y="205.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Anomaly score</text><text x="252" y="221.16" font-size="10" text-anchor="middle" class="t-mute">at least 1.0</text><path d="M252 231L252 236.5" class="cn arw"/><polygon points="252,240 249.53,235.5 254.48,235.5" class="ah arw"/><rect x="180" y="240" width="144" height="43.5" rx="5" class="nd nd-std"/><text x="252" y="258.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Image license</text><text x="252" y="273.66" font-size="10" text-anchor="middle" class="t-mute">allowed licenses only</text><rect x="354" y="0" width="150" height="297.5" rx="8" class="grp"/><text x="366" y="17" font-size="10.5" text-anchor="start" class="t-mute m">Sampling and splits</text><rect x="366" y="30" width="126" height="56.5" rx="5" class="nd nd-std"/><text x="429" y="48.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Species eligibility</text><text x="429" y="63.66" font-size="10" text-anchor="middle" class="t-mute">300+ observations,</text><text x="429" y="76.66" font-size="10" text-anchor="middle" class="t-mute">50+ in New York</text><path d="M429 86.5L429 92" class="cn arw"/><polygon points="429,95.5 426.53,91 431.48,91" class="ah arw"/><rect x="366" y="95.5" width="126" height="43.5" rx="5" class="nd nd-std"/><text x="429" y="113.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Per-species sampling</text><text x="429" y="129.16" font-size="10" text-anchor="middle" class="t-mute">max 1,000 images</text><path d="M429 139L429 144.5" class="cn arw"/><polygon points="429,148 426.53,143.5 431.48,143.5" class="ah arw"/><rect x="366" y="148" width="126" height="43.5" rx="5" class="nd nd-std"/><text x="429" y="166.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Train, val, test split</text><text x="429" y="181.66" font-size="10" text-anchor="middle" class="t-mute">val and test: New York</text><path d="M429 191.5L429 197" class="cn arw"/><polygon points="429,200.5 426.53,196 431.48,196" class="ah arw"/><rect x="366" y="200.5" width="126" height="56.5" rx="5" class="nd nd-std"/><text x="429" y="218.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Training supplement</text><text x="429" y="234.16" font-size="10" text-anchor="middle" class="t-mute">global images where</text><text x="429" y="247.16" font-size="10" text-anchor="middle" class="t-mute">New York is short</text><rect x="522" y="0" width="134" height="297.5" rx="8" class="grp"/><text x="534" y="17" font-size="10.5" text-anchor="start" class="t-mute m">Output</text><rect x="534" y="30" width="110" height="44" rx="5" class="nd nd-hero"/><text x="589" y="48.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Validated</text><text x="589" y="62.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">manifest</text><path d="M589 74L589 82.5" class="cn arw"/><polygon points="589,86 586.53,81.5 591.48,81.5" class="ah arw"/><text x="589" y="102" font-size="10.5" text-anchor="middle" class="t-mute">tracked with DVC</text><text x="589" y="136" font-size="10.5" text-anchor="middle" font-weight="500" class="t-ink m">236 species</text><text x="589" y="