lass="ln c-r2" stroke-width="2"/><path d="M38 379.45L93 374.59L148 369.88L203 351.92L258 317.52" class="ln c-r3" stroke-width="2.6"/><path d="M38 379.59L93 375.03L148 369.95L203 355.8L258 320.67" class="ln c-r4" stroke-width="2.6"/><text x="268" y="260.5" font-size="10.5" text-anchor="start" class="t-soft">×1</text><text x="268" y="285.41" font-size="10.5" text-anchor="start" class="t-soft">×2</text><text x="268" y="321.2" font-size="10.5" text-anchor="start" class="t-soft">×4</text><text x="268" y="334.7" font-size="10.5" text-anchor="start" font-weight="600" class="t-soft">×8</text><text x="203" y="34.35" font-size="11" text-anchor="middle" font-weight="700" class="t-hero m">16.52</text></svg></svg>