<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 328 544.6" width="328" height="544.6"><title>Local API load test</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
.cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
.cx text.m { font-family: var(--font-mono); }
.cx .t-ink { fill: var(--ink); }
.cx .t-soft { fill: var(--ink-soft); }
.cx .t-mute { fill: var(--muted); }
.cx .t-hero { fill: var(--accent-ink); }
.cx .t-warn { fill: var(--warn-ink); }
.cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
.cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
.cx .grid { stroke: var(--line); stroke-width: 1; }
.cx .axis { stroke: var(--line-strong); stroke-width: 1; }
.cx .brk { stroke: var(--muted); stroke-width: 1.2; }
.cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
.cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
.cx .c-hero { --c: var(--accent-ink); }
.cx .c-a { --c: var(--ink-soft); }
.cx .c-b { --c: var(--st-done); }
.cx .c-c { --c: var(--st-archive); }
.cx .c-d { --c: var(--muted); }
.cx .c-warn { --c: var(--st-progress); }
.cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
.cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
.cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
.cx .c-r4 { --c: var(--accent-ink); }
.cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
.cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.cx .bar { stroke: none; }
.cx .b-a { fill: var(--faint); }
.cx .b-hero { fill: var(--accent); }
.cx .b-warn { fill: var(--st-progress); }
.cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
.cx .b-track { fill: var(--line); }
.cx .b-q0 { fill: var(--ink-soft); }
.cx .b-q1 { fill: var(--st-done); }
.cx .b-q2 { fill: var(--accent); }
.cx .b-q3 { fill: var(--st-progress); }
.cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
.cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
.cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
.cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
.cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
.cx .nd-dash { stroke-dasharray: 4 3; }
.cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
.cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cx .cn.arw-dash { stroke-dasharray: 4 3; }
.cx .cn.arw-hero { stroke: var(--accent-ink); }
.cx .ah { fill: var(--muted); stroke: none; }
.cx .ah.arw-hero { fill: var(--accent-ink); }</style><text class="h-title" x="14" y="27.174999999999997" font-size="15.5">Local API load test</text><text class="h-sub" x="14" y="46.599999999999994" font-size="10">ONNX Runtime FP32, 2 ONNX threads,</text><text class="h-sub" x="14" y="60.599999999999994" font-size="10">30 s per level. Lines are labelled by</text><text class="h-sub" x="14" y="74.6" font-size="10">inference concurrency (×1 to ×8).</text><svg class="cx" x="14" y="84.6" width="300" height="446" viewBox="0 0 300 446" aria-hidden="true" focusable="false"><line x1="38" y1="170" x2="258" y2="170" class="axis"/><text x="30" y="173.68" font-size="10.5" text-anchor="end" class="t-mute m">0</text><line x1="38" y1="131.67" x2="258" y2="131.67" class="grid"/><text x="30" y="135.34" font-size="10.5" text-anchor="end" class="t-mute m">5</text><line x1="38" y1="93.33" x2="258" y2="93.33" class="grid"/><text x="30" y="97.01" font-size="10.5" text-anchor="end" class="t-mute m">10</text><line x1="38" y1="55" x2="258" y2="55" class="grid"/><text x="30" y="58.68" font-size="10.5" text-anchor="end" class="t-mute m">15</text><text x="38" y="189.5" font-size="10.5" text-anchor="middle" class="t-mute m">1</text><text x="93" y="189.5" font-size="10.5" text-anchor="middle" class="t-mute m">2</text><text x="148" y="189.5" font-size="10.5" text-anchor="middle" class="t-mute m">4</text><text x="203" y="189.5" font-size="10.5" text-anchor="middle" class="t-mute m">8</text><text x="258" y="189.5" font-size="10.5" text-anchor="middle" class="t-mute m">16</text><text x="148" y="211" font-size="10.5" text-anchor="middle" class="t-mute">Virtual users</text><text x="38" y="18" font-size="10.5" text-anchor="start" class="t-mute">Requests / second</text><path d="M38 111.35L93 108.67L148 114.11L203 114.11L258 109.36" class="ln c-r1" stroke-width="2"/><path d="M38 111.89L93 91.95L148 92.18L203 92.03L258 91.95" class="ln c-r2" stroke-width="2"/><path d="M38 111.2L93 93.18L148 56.53L203 56.3L25