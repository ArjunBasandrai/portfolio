<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 328 697.6" width="328" height="697.6"><title>Prediction request path</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
.cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
.cx text.m { font-family: var(--font-mono); }
.cx .t-ink { fill: var(--ink); }
.cx .t-soft { fill: var(--ink-soft); }
.cx .t-mute { fill: var(--muted); }
.cx .t-hero { fill: var(--accent-ink); }
.cx .t-warn { fill: var(--warn-ink); }
.cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
.cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
.cx .grid { stroke: var(--line); stroke-width: 1; }
.cx .axis { stroke: var(--line-strong); stroke-width: 1; }
.cx .brk { stroke: var(--muted); stroke-width: 1.2; }
.cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
.cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
.cx .c-hero { --c: var(--accent-ink); }
.cx .c-a { --c: var(--ink-soft); }
.cx .c-b { --c: var(--st-done); }
.cx .c-c { --c: var(--st-archive); }
.cx .c-d { --c: var(--muted); }
.cx .c-warn { --c: var(--st-progress); }
.cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
.cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
.cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
.cx .c-r4 { --c: var(--accent-ink); }
.cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
.cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.cx .bar { stroke: none; }
.cx .b-a { fill: var(--faint); }
.cx .b-hero { fill: var(--accent); }
.cx .b-warn { fill: var(--st-progress); }
.cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
.cx .b-track { fill: var(--line); }
.cx .b-q0 { fill: var(--ink-soft); }
.cx .b-q1 { fill: var(--st-done); }
.cx .b-q2 { fill: var(--accent); }
.cx .b-q3 { fill: var(--st-progress); }
.cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
.cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
.cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
.cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
.cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
.cx .nd-dash { stroke-dasharray: 4 3; }
.cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
.cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cx .cn.arw-dash { stroke-dasharray: 4 3; }
.cx .cn.arw-hero { stroke: var(--accent-ink); }
.cx .ah { fill: var(--muted); stroke: none; }
.cx .ah.arw-hero { fill: var(--accent-ink); }</style><text class="h-title" x="14" y="27.174999999999997" font-size="15.5">Prediction request path</text><svg class="cx" x="14" y="56.6" width="300" height="627" viewBox="0 0 300 627" aria-hidden="true" focusable="false"><rect x="0" y="0" width="300" height="29.5" rx="5" class="nd nd-hero"/><text x="150" y="18.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">POST /predict</text><path d="M150 29.5L150 37.5" class="cn arw"/><polygon points="150,41.5 147.25,36.5 152.75,36.5" class="ah arw"/><rect x="0" y="41.5" width="300" height="82.5" rx="5" class="nd nd-std"/><text x="150" y="59.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Request validation</text><text x="150" y="75.16" font-size="10" text-anchor="middle" class="t-mute">10 MiB max upload</text><text x="150" y="88.16" font-size="10" text-anchor="middle" class="t-mute">4096 × 4096 max dimensions</text><text x="150" y="101.16" font-size="10" text-anchor="middle" class="t-mute">JPEG, PNG, or WebP</text><text x="150" y="114.16" font-size="10" text-anchor="middle" class="t-mute">animated images rejected</text><path d="M150 124L150 132" class="cn arw"/><polygon points="150,136 147.25,131 152.75,131" class="ah arw"/><rect x="0" y="136" width="300" height="29.5" rx="5" class="nd nd-std"/><text x="150" y="154.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Image decode</text><path d="M150 165.5L150 173.5" class="cn arw"/><polygon points="150,177.5 147.25,172.5 152.75,172.5" class="ah arw"/><rect x="0" y="177.5" width="300" height="29.5" rx="5" class="nd nd-std"/><text x="150" y="195.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Preprocess to 224 × 224</text><path d="M150 207L150 215" class="cn arw"/><polygon points="150,219 147.25,214 152.75,214" class="ah arw"/><rect x="0" y="219" width="300" height="58" rx="5" class="nd nd-std"/><text x="150" y="237.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Bounded inference</text><text x="150" y="251.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">concurrency</text><text x="150" y="267.16" font-size="10" text-anchor="middle" class="t-mute">thread pool</text><path d="M150 277L150 285" class="cn arw"/><polygon points="150,289 147.25,284 152.75,284" class="ah arw"/><rect x="0" y="289" width="300" height="44" rx="5" class="nd nd-hero"/><text x="150" y="307.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">ONNX Runtime FP32</text><text x="150" y="321.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">CPU</text><path d="M150 333L150 341" class="cn arw"/><polygon points="150,345 147.25,340 152.75,340" class="ah arw"/><rect x="0" y="345" width="300" height="29.5" rx="5" class="nd nd-std"/><text x="150" y="363.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Logits to probabilities</text><path d="M150 374.5L150 382.5" class="cn arw"/><polygon points="150,386.5 147.25,381.5 152.75,381.5" class="ah arw"/><rect x="0" y="386.5" width="300" height="82.5" rx="5" class="nd nd-std"/><text x="150" y="404.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Confidence filter</text><text x="150" y="420.16" font-size="10" text-anchor="middle" class="t-mute">top-1 at or below 0.50: return []</text><text x="150" y="433.16" font-size="10" text-anchor="middle" class="t-mute">otherwise sort descending</text><text x="150" y="446.16" font-size="10" text-anchor="middle" class="t-mute">stop at cumulative 0.90</text><text x="150" y="459.16" font-size="10" text-anchor="middle" class="t-mute">return at most 5</text><path d="M150 469L150 477" class="cn arw"/><polygon points="150,481 147.25,476 152.75,476" class="ah arw"/><rect x="0" y="481" width="300" height="82.5" rx="5" class="nd nd-std"/><text x="150" y="499.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">JSON response</text><text x="150" y="514.66" font-size="10" text-anchor="middle" class="t-mute">common name</text><text x="150" y="527.66" font-size="10" text-anchor="middle" class="t-mute">scientific name</text><text x="150" y="540.66" font-size="10" text-anchor="middle" class="t-mute">taxon ID</text><text x="150" y="553.66" font-size="10" text-anchor="middle" class="t-mute">confidence</text><rect x="0" y="581.5" width="300" height="43.5" rx="5" class="nd nd-mute nd-dash"/><text x="150" y="599.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-mute">Side path: metrics and logging</text><text x="150" y="615.43" font-size="10" text-anchor="middle" class="t-mute">Prometheus counters, request logs</text></svg></svg>