<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 328 583.1" width="328" height="583.1">
  <title>Possible Pi camera setup</title>
  <style>
    svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}
    @media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}
    .cx { overflow: visible; }
    .cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
    .cx text.m { font-family: var(--font-mono); }
    .cx .t-ink { fill: var(--ink); }
    .cx .t-soft { fill: var(--ink-soft); }
    .cx .t-mute { fill: var(--muted); }
    .cx .t-hero { fill: var(--accent-ink); }
    .cx .t-warn { fill: var(--warn-ink); }
    .cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
    .cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
    .cx .grid { stroke: var(--line); stroke-width: 1; }
    .cx .axis { stroke: var(--line-strong); stroke-width: 1; }
    .cx .brk { stroke: var(--muted); stroke-width: 1.2; }
    .cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
    .cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
    .cx .c-hero { --c: var(--accent-ink); }
    .cx .c-a { --c: var(--ink-soft); }
    .cx .c-b { --c: var(--st-done); }
    .cx .c-c { --c: var(--st-archive); }
    .cx .c-d { --c: var(--muted); }
    .cx .c-warn { --c: var(--st-progress); }
    .cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
    .cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
    .cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
    .cx .c-r4 { --c: var(--accent-ink); }
    .cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
    .cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
    .cx .bar { stroke: none; }
    .cx .b-a { fill: var(--faint); }
    .cx .b-hero { fill: var(--accent); }
    .cx .b-warn { fill: var(--st-progress); }
    .cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
    .cx .b-track { fill: var(--line); }
    .cx .b-q0 { fill: var(--ink-soft); }
    .cx .b-q1 { fill: var(--st-done); }
    .cx .b-q2 { fill: var(--accent); }
    .cx .b-q3 { fill: var(--st-progress); }
    .cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
    .cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
    .cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
    .cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
    .cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
    .cx .nd-dash { stroke-dasharray: 4 3; }
    .cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
    .cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .cx .cn.arw-dash { stroke-dasharray: 4 3; }
    .cx .cn.arw-hero { stroke: var(--accent-ink); }
    .cx .ah { fill: var(--muted); stroke: none; }
    .cx .ah.arw-hero { fill: var(--accent-ink); }
  </style>

  <text class="h-title" x="14" y="27.175" font-size="15.5">Possible Pi camera setup</text>
  <text class="h-sub" x="14" y="46.6" font-size="10">Future work, not part of the current system</text>

  <svg class="cx" x="14" y="56.6" width="300" height="512.5" viewBox="0 0 300 512.5" aria-hidden="true" focusable="false">

    <rect x="0" y="0" width="300" height="231" rx="8" class="grp"/>
    <text x="12" y="17" font-size="10.5" text-anchor="start" class="t-mute m">Pi Zero W: capture and filtering</text>

    <rect x="20" y="28" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="46.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Camera fixed region</text>

    <path d="M150 57L150 64.5" class="cn arw"/>
    <polygon points="150,68 147.53,63.5 152.48,63.5" class="ah arw"/>

    <rect x="20" y="68" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="86.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Frame-change detection</text>

    <path d="M150 97L150 104.5" class="cn arw"/>
    <polygon points="150,108 147.53,103.5 152.48,103.5" class="ah arw"/>

    <rect x="20" y="108" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="126.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Persistence check</text>

    <path d="M150 137L150 144.5" class="cn arw"/>
    <polygon points="150,148 147.53,143.5 152.48,143.5" class="ah arw"/>

    <rect x="20" y="148" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="166.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Cooldown and duplicate filter</text>

    <path d="M150 177L150 184.5" class="cn arw"/>
    <polygon points="150,188 147.53,183.5 152.48,183.5" class="ah arw"/>

    <rect x="20" y="188" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="206.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Candidate image</text>

    <path d="M150 231L150 246.5" class="cn arw"/>
    <polygon points="150,251 146.98,245.5 153.03,245.5" class="ah arw"/>

    <rect x="40" y="251" width="220" height="42.5" rx="5" class="nd nd-hero"/>
    <text x="150" y="269.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Birdly API</text>
    <text x="150" y="283.75" font-size="9.5" text-anchor="middle" class="t-mute">Cloud Run, ONNX Runtime</text>

    <path d="M150 293.5L150 309" class="cn arw"/>
    <polygon points="150,313.5 146.98,308 153.03,308" class="ah arw"/>

    <rect x="0" y="313.5" width="300" height="199" rx="8" class="grp"/>
    <text x="12" y="330.5" font-size="10.5" text-anchor="start" class="t-mute m">Pi Zero W: storage and local page</text>

    <rect x="20" y="341.5" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="359.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">SQLite observation record</text>

    <rect x="20" y="378.5" width="260" height="29" rx="5" class="nd nd-std"/>
    <text x="150" y="396.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Saved image</text>

    <path d="M150 407.5L150 414.5" class="cn arw"/>
    <polygon points="150,418.5 147.25,413.5 152.75,413.5" class="ah arw"/>

    <rect x="20" y="418.5" width="260" height="80" rx="5" class="nd nd-std"/>
    <text x="150" y="436.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Local web page</text>
    <text x="150" y="451.25" font-size="9.5" text-anchor="middle" class="t-mute">observation history</text>
    <text x="150" y="463.75" font-size="9.5" text-anchor="middle" class="t-mute">species list</text>
    <text x="150" y="476.25" font-size="9.5" text-anchor="middle" class="t-mute">CSV export</text>
    <text x="150" y="488.75" font-size="9.5" text-anchor="middle" class="t-mute">ZIP and image export</text>

  </svg>
</svg>