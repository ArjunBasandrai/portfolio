<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 328 442.6" width="328" height="442.6"><title>CPU batch-1 end-to-end latency</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
.cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
.cx text.m { font-family: var(--font-mono); }
.cx .t-ink { fill: var(--ink); }
.cx .t-soft { fill: var(--ink-soft); }
.cx .t-mute { fill: var(--muted); }
.cx .t-hero { fill: var(--accent-ink); }
.cx .t-warn { fill: var(--warn-ink); }
.cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
.cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
.cx .grid { stroke: var(--line); stroke-width: 1; }
.cx .axis { stroke: var(--line-strong); stroke-width: 1; }
.cx .brk { stroke: var(--muted); stroke-width: 1.2; }
.cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
.cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
.cx .c-hero { --c: var(--accent-ink); }
.cx .c-a { --c: var(--ink-soft); }
.cx .c-b { --c: var(--st-done); }
.cx .c-c { --c: var(--st-archive); }
.cx .c-d { --c: var(--muted); }
.cx .c-warn { --c: var(--st-progress); }
.cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
.cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
.cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
.cx .c-r4 { --c: var(--accent-ink); }
.cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
.cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.cx .bar { stroke: none; }
.cx .b-a { fill: var(--faint); }
.cx .b-hero { fill: var(--accent); }
.cx .b-warn { fill: var(--st-progress); }
.cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
.cx .b-track { fill: var(--line); }
.cx .b-q0 { fill: var(--ink-soft); }
.cx .b-q1 { fill: var(--st-done); }
.cx .b-q2 { fill: var(--accent); }
.cx .b-q3 { fill: var(--st-progress); }
.cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
.cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
.cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
.cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
.cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
.cx .nd-dash { stroke-dasharray: 4 3; }
.cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
.cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cx .cn.arw-dash { stroke-dasharray: 4 3; }
.cx .cn.arw-hero { stroke: var(--accent-ink); }
.cx .ah { fill: var(--muted); stroke: none; }
.cx .ah.arw-hero { fill: var(--accent-ink); }</style><text class="h-title" x="14" y="27.174999999999997" font-size="15.5">CPU batch-1 end-to-end latency</text><text class="h-sub" x="14" y="46.599999999999994" font-size="10">Includes image decoding and</text><text class="h-sub" x="14" y="60.599999999999994" font-size="10">preprocessing. Lower is better.</text><svg class="cx" x="14" y="70.6" width="300" height="358" viewBox="0 0 300 358" aria-hidden="true" focusable="false"><defs><pattern id="hatch-cpu-m" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" class="hatch"/></pattern></defs><rect x="2" y="2" width="10" height="10" rx="2" class="bar b-a"/><text x="17" y="11" font-size="11" text-anchor="start" class="t-soft">PyTorch eager FP32</text><rect x="150" y="2" width="10" height="10" rx="2" class="bar b-hero"/><text x="165" y="11" font-size="11" text-anchor="start" class="t-soft">ONNX Runtime FP32</text><rect x="2" y="20" width="10" height="10" rx="2" class="bar b-int8" fill="url(#hatch-cpu-m)"/><text x="17" y="29" font-size="11" text-anchor="start" class="t-soft">ONNX Runtime INT8</text><text x="6" y="60" font-size="11" text-anchor="start" class="t-mute m">1 thread</text><rect x="6" y="68" width="168.11" height="14" rx="2" class="bar b-a"/><text x="180.11" y="79" font-size="11" text-anchor="start" class="t-soft m">245.56</text><rect x="6" y="86" width="144.33" height="14" rx="2" class="bar b-hero"/><text x="156.33" y="97" font-size="11" text-anchor="start" class="t-hero m">210.82</text><rect x="6" y="104" width="141.65" height="14" rx="2" class="bar b-int8" fill="url(#hatch-cpu-m)"/><text x="153.65" y="115" font-size="11" text-anchor="start" class="t-soft m">206.90</text><text x="6" y="144" font-size="11" text-anchor="start" class="t-mute m">2 threads</text><rect x="6" y="152" width="95.14" height="14" rx="2" class="bar b-a"/><text x="107.14" y="163" font-size="11" text-anchor="start" class="t-soft m">138.97</text><rect x="6" y="170" width="76.66" height="14" rx="2" class="bar b-hero"/><text x="88.66" y="181" font-size="11" text-anchor="start" class="t-hero m">111.97</text><rect x="6" y="188" width="79.13" height="14" rx="2" class="bar b-int8" fill="url(#hatch-cpu-m)"/><text x="91.13" y="199" font-size="11" text-anchor="start" class="t-soft m">115.59</text><rect x="0" y="212" width="300" height="118" rx="6" class="hl"/><text x="6" y="228" font-size="11" text-anchor="start" class="t-ink m">4 threads</text><rect x="6" y="236" width="64.76" height="14" rx="2" class="bar b-a"/><text x="76.76" y="247" font-size="11" text-anchor="start" font-weight="700" class="t-soft m">94.59</text><rect x="6" y="254" width="43.73" height="14" rx="2" class="bar b-hero"/><text x="55.73" y="265" font-size="11" text-anchor="start" font-weight="700" class="t-hero m">63.87</text><rect x="6" y="272" width="48.37" height="14" rx="2" class="bar b-int8" fill="url(#hatch-cpu-m)"/><text x="60.37" y="283" font-size="11" text-anchor="start" font-weight="700" class="t-soft m">70.65</text><text x="10" y="302" font-size="12" text-anchor="start" font-weight="700" class="t-hero">PyTorch → ONNX FP32: −32%</text><text x="10" y="319" font-size="11" text-anchor="start" class="t-warn">INT8: 70.65 ms vs FP32: 63.87 ms</text><text x="150" y="345" font-size="10.5" text-anchor="middle" class="t-mute">Latency (ms), lower is better</text></svg></svg>