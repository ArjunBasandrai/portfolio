<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 328 667.1" width="328" height="667.1"><title>Data pipeline</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
.cx text { font-family: var(--font-sans); fill: var(--ink-soft); }
.cx text.m { font-family: var(--font-mono); }
.cx .t-ink { fill: var(--ink); }
.cx .t-soft { fill: var(--ink-soft); }
.cx .t-mute { fill: var(--muted); }
.cx .t-hero { fill: var(--accent-ink); }
.cx .t-warn { fill: var(--warn-ink); }
.cx text.h-title { font-family: var(--font-serif); fill: var(--ink); }
.cx text.h-sub { font-family: var(--font-mono); fill: var(--muted); }
.cx .grid { stroke: var(--line); stroke-width: 1; }
.cx .axis { stroke: var(--line-strong); stroke-width: 1; }
.cx .brk { stroke: var(--muted); stroke-width: 1.2; }
.cx .hl { fill: color-mix(in oklch, var(--accent-soft) 65%, transparent); }
.cx .gapfill { fill: color-mix(in oklch, var(--accent-ink) 13%, transparent); }
.cx .c-hero { --c: var(--accent-ink); }
.cx .c-a { --c: var(--ink-soft); }
.cx .c-b { --c: var(--st-done); }
.cx .c-c { --c: var(--st-archive); }
.cx .c-d { --c: var(--muted); }
.cx .c-warn { --c: var(--st-progress); }
.cx .c-r1 { --c: color-mix(in oklch, var(--accent-ink) 22%, var(--faint)); }
.cx .c-r2 { --c: color-mix(in oklch, var(--accent-ink) 45%, var(--faint)); }
.cx .c-r3 { --c: color-mix(in oklch, var(--accent-ink) 72%, var(--faint)); }
.cx .c-r4 { --c: var(--accent-ink); }
.cx .ln { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; }
.cx .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.cx .bar { stroke: none; }
.cx .b-a { fill: var(--faint); }
.cx .b-hero { fill: var(--accent); }
.cx .b-warn { fill: var(--st-progress); }
.cx .b-int8 { stroke: var(--st-progress); stroke-width: 1.3; }
.cx .b-track { fill: var(--line); }
.cx .b-q0 { fill: var(--ink-soft); }
.cx .b-q1 { fill: var(--st-done); }
.cx .b-q2 { fill: var(--accent); }
.cx .b-q3 { fill: var(--st-progress); }
.cx .hatch { stroke: var(--st-progress); stroke-width: 1.4; }
.cx .nd { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }
.cx .nd-hero { fill: var(--accent-soft); stroke: var(--accent-ink); stroke-width: 1.3; }
.cx .nd-warn { fill: color-mix(in oklch, var(--st-progress) 14%, var(--paper)); stroke: var(--st-progress); stroke-width: 1.3; }
.cx .nd-mute { fill: transparent; stroke-dasharray: 4 3; }
.cx .nd-dash { stroke-dasharray: 4 3; }
.cx .grp { fill: color-mix(in oklch, var(--paper-2) 55%, transparent); stroke: var(--line); stroke-width: 1; }
.cx .cn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cx .cn.arw-dash { stroke-dasharray: 4 3; }
.cx .cn.arw-hero { stroke: var(--accent-ink); }
.cx .ah { fill: var(--muted); stroke: none; }
.cx .ah.arw-hero { fill: var(--accent-ink); }</style><text class="h-title" x="14" y="27.174999999999997" font-size="15.5">Data pipeline</text><text class="h-sub" x="14" y="46.599999999999994" font-size="10">iNaturalist Open Data to a validated manifest</text><svg class="cx" x="14" y="56.6" width="300" height="596.5" viewBox="0 0 300 596.5" aria-hidden="true" focusable="false"><rect x="0" y="0" width="300" height="143" rx="8" class="grp"/><text x="12" y="17" font-size="10.5" text-anchor="start" class="t-mute m">iNaturalist Open Data</text><rect x="12" y="28" width="276" height="29" rx="5" class="nd nd-std"/><text x="150" y="46.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">observations.csv</text><rect x="12" y="64" width="276" height="29" rx="5" class="nd nd-std"/><text x="150" y="82.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">photos.csv</text><rect x="12" y="100" width="276" height="29" rx="5" class="nd nd-std"/><text x="150" y="118.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">taxa.csv</text><path d="M150 143L150 156.5" class="cn arw"/><polygon points="150,161 146.98,155.5 153.03,155.5" class="ah arw"/><rect x="0" y="161" width="300" height="183.5" rx="8" class="grp"/><text x="12" y="178" font-size="10.5" text-anchor="start" class="t-mute m">Polars streaming</text><rect x="12" y="189" width="134" height="42.5" rx="5" class="nd nd-std"/><text x="79" y="207.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Taxonomy</text><text x="79" y="221.75" font-size="9.5" text-anchor="middle" class="t-mute">active bird species</text><rect x="154" y="189" width="134" height="42.5" rx="5" class="nd nd-std"/><text x="221" y="207.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Research grade</text><text x="221" y="221.75" font-size="9.5" text-anchor="middle" class="t-mute">observations only</text><rect x="12" y="238.5" width="134" height="42.5" rx="5" class="nd nd-std"/><text x="79" y="256.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">New York</text><text x="79" y="271.25" font-size="9.5" text-anchor="middle" class="t-mute">bounding box</text><rect x="154" y="238.5" width="134" height="42.5" rx="5" class="nd nd-std"/><text x="221" y="256.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Anomaly score</text><text x="221" y="271.25" font-size="9.5" text-anchor="middle" class="t-mute">at least 1.0</text><rect x="12" y="288" width="134" height="42.5" rx="5" class="nd nd-std"/><text x="79" y="306.02" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Image license</text><text x="79" y="320.75" font-size="9.5" text-anchor="middle" class="t-mute">allowed licenses only</text><path d="M150 344.5L150 358" class="cn arw"/><polygon points="150,362.5 146.98,357 153.03,357" class="ah arw"/><rect x="0" y="362.5" width="300" height="159" rx="8" class="grp"/><text x="12" y="379.5" font-size="10.5" text-anchor="start" class="t-mute m">Sampling and splits</text><rect x="12" y="390.5" width="134" height="55" rx="5" class="nd nd-std"/><text x="79" y="408.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Species eligibility</text><text x="79" y="423.25" font-size="9.5" text-anchor="middle" class="t-mute">300+ observations,</text><text x="79" y="435.75" font-size="9.5" text-anchor="middle" class="t-mute">50+ in New York</text><rect x="154" y="390.5" width="134" height="55" rx="5" class="nd nd-std"/><text x="221" y="414.77" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Per-species sampling</text><text x="221" y="429.5" font-size="9.5" text-anchor="middle" class="t-mute">max 1,000 images</text><rect x="12" y="452.5" width="134" height="55" rx="5" class="nd nd-std"/><text x="79" y="476.77" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Train, val, test split</text><text x="79" y="491.5" font-size="9.5" text-anchor="middle" class="t-mute">val and test: New York</text><rect x="154" y="452.5" width="134" height="55" rx="5" class="nd nd-std"/><text x="221" y="470.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Training supplement</text><text x="221" y="485.25" font-size="9.5" text-anchor="middle" class="t-mute">global images where</text><text x="221" y="497.75" font-size="9.5" text-anchor="middle" class="t-mute">New York is short</text><path d="M150 521.5L150 535" class="cn arw"/><polygon points="150,539.5 146.98,534 153.03,534" class="ah arw"/><rect x="0" y="539.5" width="300" height="55" rx="5" class="nd nd-hero"/><text x="150" y="557.52" font-size="11" text-anchor="middle" font-weight="600" class="t-ink">Validated manifest</text><text x="150" y="572.25" font-size="9.5" text-anchor="middle" class="t-mute">236 species · 233,796 manifest rows · 4,712 test images</text><text x="150" y="584.75" font-size="9.5" text-anchor="middle" class="t-mute">tracked with DVC</text></svg></svg>