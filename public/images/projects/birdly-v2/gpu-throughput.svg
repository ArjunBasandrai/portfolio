 202.46L424.4 200.03L518 200.44" class="ln c-a" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M50 245.55L143.6 231.12L237.2 205.51L330.8 175.8L424.4 153.37L518 138.22" class="ln c-b" stroke-width="2.2"/><path d="M50 196.48L143.6 159.83L237.2 132.16L330.8 112.5L424.4 96.32L518 63.94" class="ln c-hero" stroke-width="3.2"/><circle cx="50" cy="196.48" r="4.800000000000001" class="dot c-hero"/><circle cx="143.6" cy="159.83" r="4.800000000000001" class="dot c-hero"/><circle cx="237.2" cy="132.16" r="4.800000000000001" class="dot c-hero"/><circle cx="330.8" cy="112.5" r="4.800000000000001" class="dot c-hero"/><circle cx="424.4" cy="96.32" r="4.800000000000001" class="dot c-hero"/><circle cx="518" cy="63.94" r="4.800000000000001" class="dot c-hero"/><text x="528" y="227.39" font-size="11.5" text-anchor="start" class="t-soft">ONNX Runtime CUDA</text><text x="528" y="204.47" font-size="11.5" text-anchor="start" class="t-soft">PyTorch FP32</text><text x="528" y="142.25" font-size="11.5" text-anchor="start" class="t-soft">PyTorch FP16</text><text x="528" y="67.96" font-size="11.5" text-anchor="start" font-weight="600" class="t-hero">TensorRT FP16</text><text x="510" y="50.94" font-size="12.5" text-anchor="end" font-weight="700" class="t-hero m">730.66 img/s</text><text x="510" y="189.44" font-size="11" text-anchor="end" class="t-mute m">232.13</text></svg></svg>