<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 696 159.4" width="696" height="159.4"><title>Deployed request path</title><style>svg.cx{--paper:#faf8f5;--paper-2:#f0ebe5;--surface:#fffdfb;--ink:#3d3930;--ink-soft:#6b6459;--muted:#8b8278;--faint:#b8b1a5;--line:#e8e2d9;--line-strong:#ddd6cd;--accent:#8b9556;--accent-ink:#6d7644;--accent-soft:#f0f3e6;--st-progress:#c9a566;--st-done:#6b8fa3;--st-archive:#9a8a7a;--warn-ink:#8a5f17;--font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-serif:"Newsreader", Georgia, "Times New Roman", serif;--font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace}@media (prefers-color-scheme:dark){svg.cx{--paper:#1f1a24;--paper-2:#2a2430;--surface:#2e2836;--ink:#f5f1ed;--ink-soft:#ddd5cd;--muted:#b8aea3;--faint:#7a7268;--line:#3d3847;--line-strong:#4a4451;--accent:#a8c75d;--accent-ink:#b8d76f;--accent-soft:#4a5228;--st-progress:#d4ba7a;--st-done:#7fa3bb;--st-archive:#a89a8a;--warn-ink:#e3c98c}}.cx { overflow: visible; }
