<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 696 387.4" width="696" height="387.4">
  <title>TensorRT FP16: model-only vs end-to-end throughput</title>
  <style>
    svg.cx{
      --paper:#faf8f5;
      --paper-2:#f0ebe5;
      --surface:#fffdfb;
      --ink:#3d3930;
      --ink-soft:#6b6459;
      --muted:#8b8278;
      --faint:#b8b1a5;
      --line:#e8e2d9;
      --line-strong:#ddd6cd;
      --accent:#8b9556;
      --accent-ink:#6d7644;
      --accent-soft:#f0f3e6;
      --st-progress:#c9a566;
      --st-done:#6b8fa3;
      --st-archive:#9a8a7a;
      --warn-ink:#8a5f17;
      --font-sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --font-serif:"Newsreader",Georgia,"Times New Roman",serif;
      --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace
    }

    @media (prefers-color-scheme:dark){
      svg.cx{
        --paper:#1f1a24;
        --paper-2:#2a2430;
        --surface:#2e2836;
        --ink:#f5f1ed;
        --ink-soft:#ddd5cd;
        --muted:#b8aea3;
        --faint:#7a7268;
        --line:#3d3847;
        --line-strong:#4a4451;
        --accent:#a8c75d;
        --accent-ink:#b8d76f;
        --accent-soft:#4a5228;
        --st-progress:#d4ba7a;
        --st-done:#7fa3bb;
        --st-archive:#a89a8a;
        --warn-ink:#e3c98c
      }
    }

    .cx{overflow:visible}
    .cx text{font-family:var(--font-sans);fill:var(--ink-soft)}
    .cx text.m{font-family:var(--font-mono)}
    .cx .t-ink{fill:var(--ink)}
    .cx .t-soft{fill:var(--ink-soft)}
    .cx .t-mute{fill:var(--muted)}
    .cx .t-hero{fill:var(--accent-ink)}
    .cx .t-warn{fill:var(--warn-ink)}
    .cx text.h-title{font-family:var(--font-serif);fill:var(--ink)}
    .cx text.h-sub{font-family:var(--font-mono);fill:var(--muted)}
    .cx .grid{stroke:var(--line);stroke-width:1}
    .cx .axis{stroke:var(--line-strong);stroke-width:1}
    .cx .brk{stroke:var(--muted);stroke-width:1.2}
    .cx .hl{fill:color-mix(in oklch,var(--accent-soft) 65%,transparent)}
    .cx .gapfill{fill:color-mix(in oklch,var(--accent-ink) 13%,transparent)}
    .cx .c-hero{--c:var(--accent-ink)}
    .cx .c-a{--c:var(--ink-soft)}
    .cx .c-b{--c:var(--st-done)}
    .cx .c-c{--c:var(--st-archive)}
    .cx .c-d{--c:var(--muted)}
    .cx .c-warn{--c:var(--st-progress)}
    .cx .c-r1{--c:color-mix(in oklch,var(--accent-ink) 22%,var(--faint))}
    .cx .c-r2{--c:color-mix(in oklch,var(--accent-ink) 45%,var(--faint))}
    .cx .c-r3{--c:color-mix(in oklch,var(--accent-ink) 72%,var(--faint))}
    .cx .c-r4{--c:var(--accent-ink)}
    .cx .ln{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round}
    .cx .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
    .cx .bar{stroke:none}
    .cx .b-a{fill:var(--faint)}
    .cx .b-hero{fill:var(--accent)}
    .cx .b-warn{fill:var(--st-progress)}
    .cx .b-int8{stroke:var(--st-progress);stroke-width:1.3}
    .cx .b-track{fill:var(--line)}
    .cx .b-q0{fill:var(--ink-soft)}
    .cx .b-q1{fill:var(--st-done)}
    .cx .b-q2{fill:var(--accent)}
    .cx .b-q3{fill:var(--st-progress)}
    .cx .hatch{stroke:var(--st-progress);stroke-width:1.4}
    .cx .nd{fill:var(--paper);stroke:var(--line-strong);stroke-width:1}
    .cx .nd-hero{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:1.3}
    .cx .nd-warn{fill:color-mix(in oklch,var(--st-progress) 14%,var(--paper));stroke:var(--st-progress);stroke-width:1.3}
    .cx .nd-mute{fill:transparent;stroke-dasharray:4 3}
    .cx .nd-dash{stroke-dasharray:4 3}
    .cx .grp{fill:color-mix(in oklch,var(--paper-2) 55%,transparent);stroke:var(--line);stroke-width:1}
    .cx .cn{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .cx .cn.arw-dash{stroke-dasharray:4 3}
    .cx .cn.arw-hero{stroke:var(--accent-ink)}
    .cx .ah{fill:var(--muted);stroke:none}
    .cx .ah.arw-hero{fill:var(--accent-ink)}
  </style>

  <text class="h-title" x="20" y="34.45" font-size="17">TensorRT FP16: model-only vs end-to-end throughput</text>
  <text class="h-sub" x="20" y="56.4" font-size="11">RTX 3050 Laptop GPU. End-to-end includes decoding and preprocessing.</text>

  <svg class="cx" x="20" y="66.4" width="656" height="301" viewBox="0 0 656 301" aria-hidden="true" focusable="false">

    <path d="M50 185.18L143.6 151.08L237.2 125.33L330.8 107.04L424.4 91.99L518 61.86L518 217.99L424.4 218.42L330.8 218.89L237.2 218.84L143.6 219.72L50 223.27Z" class="gapfill"/>

    <line x1="50" y1="248" x2="518" y2="248" class="axis"/>
    <text x="42" y="252.03" font-size="11.5" text-anchor="end" class="t-mute m">0</text>

    <line x1="50" y1="197.05" x2="518" y2="197.05" class="grid"/>
    <text x="42" y="201.07" font-size="11.5" text-anchor="end" class="t-mute m">200</text>

    <line x1="50" y1="146.1" x2="518" y2="146.1" class="grid"/>
    <text x="42" y="150.12" font-size="11.5" text-anchor="end" class="t-mute m">400</text>

    <line x1="50" y1="95.14" x2="518" y2="95.14" class="grid"/>
    <text x="42" y="99.17" font-size="11.5" text-anchor="end" class="t-mute m">600</text>

    <line x1="50" y1="44.19" x2="518" y2="44.19" class="grid"/>
    <text x="42" y="48.22" font-size="11.5" text-anchor="end" class="t-mute m">800</text>

    <text x="50" y="268.5" font-size="11.5" text-anchor="middle" class="t-mute m">1</text>
    <text x="143.6" y="268.5" font-size="11.5" text-anchor="middle" class="t-mute m">2</text>
    <text x="237.2" y="268.5" font-size="11.5" text-anchor="middle" class="t-mute m">4</text>
    <text x="330.8" y="268.5" font-size="11.5" text-anchor="middle" class="t-mute m">8</text>
    <text x="424.4" y="268.5" font-size="11.5" text-anchor="middle" class="t-mute m">16</text>
    <text x="518" y="268.5" font-size="11.5" text-anchor="middle" class="t-mute m">32</text>

    <text x="50" y="20" font-size="11.5" text-anchor="start" class="t-mute">Images / second, TensorRT FP16</text>

    <path d="M50 223.27L143.6 219.72L237.2 218.84L330.8 218.89L424.4 218.42L518 217.99" class="ln c-a" stroke-width="2.2"/>

    <circle cx="50" cy="223.27" r="3.8" class="dot c-a"/>
    <circle cx="143.6" cy="219.72" r="3.8" class="dot c-a"/>
    <circle cx="237.2" cy="218.84" r="3.8" class="dot c-a"/>
    <circle cx="330.8" cy="218.89" r="3.8" class="dot c-a"/>
    <circle cx="424.4" cy="218.42" r="3.8" class="dot c-a"/>
    <circle cx="518" cy="217.99" r="3.8" class="dot c-a"/>

    <path d="M50 185.18L143.6 151.08L237.2 125.33L330.8 107.04L424.4 91.99L518 61.86" class="ln c-hero" stroke-width="3"/>

    <circle cx="50" cy="185.18" r="4.6" class="dot c-hero"/>
    <circle cx="143.6" cy="151.08" r="4.6" class="dot c-hero"/>
    <circle cx="237.2" cy="125.33" r="4.6" class="dot c-hero"/>
    <circle cx="330.8" cy="107.04" r="4.6" class="dot c-hero"/>
    <circle cx="424.4" cy="91.99" r="4.6" class="dot c-hero"/>
    <circle cx="518" cy="61.86" r="4.6" class="dot c-hero"/>

    <text x="528" y="222.01" font-size="11.5" text-anchor="start" class="t-soft">End to end</text>
    <text x="528" y="65.88" font-size="11.5" text-anchor="start" font-weight="600" class="t-hero">Model only</text>

    <text x="510" y="49.86" font-size="12" text-anchor="end" font-weight="700" class="t-hero m">730.66</text>
    <text x="510" y="206.99" font-size="12" text-anchor="end" font-weight="700" class="t-soft m">117.81</text>

    <text x="342.8" y="202.7" font-size="11.5" text-anchor="middle" class="t-mute m">≈ 115–118 img/s from batch 4</text>

    <text x="284" y="290.5" font-size="11.5" text-anchor="middle" class="t-mute">Batch size</text>

  </svg>
</svg>