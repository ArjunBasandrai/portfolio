<svg xmlns="http://www.w3.org/2000/svg" class="cx" viewBox="0 0 696 366.4" width="696" height="366.4">
  <title>Possible Pi camera setup</title>

  <style>
    svg.cx{
      --paper:#faf8f5;
      --paper-2:#f0ebe5;
      --surface:#fffdfb;
      --ink:#3d3930;
      --ink-soft:#6b6459;
      --muted:#8b8278;
      --faint:#b8b1a5;
      --line:#e8e2d9;
      --line-strong:#ddd6cd;
      --accent:#8b9556;
      --accent-ink:#6d7644;
      --accent-soft:#f0f3e6;
      --st-progress:#c9a566;
      --st-done:#6b8fa3;
      --st-archive:#9a8a7a;
      --warn-ink:#8a5f17;
      --font-sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --font-serif:"Newsreader",Georgia,"Times New Roman",serif;
      --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace
    }

    @media (prefers-color-scheme:dark){
      svg.cx{
        --paper:#1f1a24;
        --paper-2:#2a2430;
        --surface:#2e2836;
        --ink:#f5f1ed;
        --ink-soft:#ddd5cd;
        --muted:#b8aea3;
        --faint:#7a7268;
        --line:#3d3847;
        --line-strong:#4a4451;
        --accent:#a8c75d;
        --accent-ink:#b8d76f;
        --accent-soft:#4a5228;
        --st-progress:#d4ba7a;
        --st-done:#7fa3bb;
        --st-archive:#a89a8a;
        --warn-ink:#e3c98c
      }
    }

    .cx{overflow:visible}
    .cx text{font-family:var(--font-sans);fill:var(--ink-soft)}
    .cx text.m{font-family:var(--font-mono)}
    .cx .t-ink{fill:var(--ink)}
    .cx .t-soft{fill:var(--ink-soft)}
    .cx .t-mute{fill:var(--muted)}
    .cx .t-hero{fill:var(--accent-ink)}
    .cx .t-warn{fill:var(--warn-ink)}
    .cx text.h-title{font-family:var(--font-serif);fill:var(--ink)}
    .cx text.h-sub{font-family:var(--font-mono);fill:var(--muted)}
    .cx .grid{stroke:var(--line);stroke-width:1}
    .cx .axis{stroke:var(--line-strong);stroke-width:1}
    .cx .brk{stroke:var(--muted);stroke-width:1.2}
    .cx .hl{fill:color-mix(in oklch,var(--accent-soft) 65%,transparent)}
    .cx .gapfill{fill:color-mix(in oklch,var(--accent-ink) 13%,transparent)}
    .cx .c-hero{--c:var(--accent-ink)}
    .cx .c-a{--c:var(--ink-soft)}
    .cx .c-b{--c:var(--st-done)}
    .cx .c-c{--c:var(--st-archive)}
    .cx .c-d{--c:var(--muted)}
    .cx .c-warn{--c:var(--st-progress)}
    .cx .c-r1{--c:color-mix(in oklch,var(--accent-ink) 22%,var(--faint))}
    .cx .c-r2{--c:color-mix(in oklch,var(--accent-ink) 45%,var(--faint))}
    .cx .c-r3{--c:color-mix(in oklch,var(--accent-ink) 72%,var(--faint))}
    .cx .c-r4{--c:var(--accent-ink)}
    .cx .ln{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round}
    .cx .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
    .cx .bar{stroke:none}
    .cx .b-a{fill:var(--faint)}
    .cx .b-hero{fill:var(--accent)}
    .cx .b-warn{fill:var(--st-progress)}
    .cx .b-int8{stroke:var(--st-progress);stroke-width:1.3}
    .cx .b-track{fill:var(--line)}
    .cx .b-q0{fill:var(--ink-soft)}
    .cx .b-q1{fill:var(--st-done)}
    .cx .b-q2{fill:var(--accent)}
    .cx .b-q3{fill:var(--st-progress)}
    .cx .hatch{stroke:var(--st-progress);stroke-width:1.4}
    .cx .nd{fill:var(--paper);stroke:var(--line-strong);stroke-width:1}
    .cx .nd-hero{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:1.3}
    .cx .nd-warn{fill:color-mix(in oklch,var(--st-progress) 14%,var(--paper));stroke:var(--st-progress);stroke-width:1.3}
    .cx .nd-mute{fill:transparent;stroke-dasharray:4 3}
    .cx .nd-dash{stroke-dasharray:4 3}
    .cx .grp{fill:color-mix(in oklch,var(--paper-2) 55%,transparent);stroke:var(--line);stroke-width:1}
    .cx .cn{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .cx .cn.arw-dash{stroke-dasharray:4 3}
    .cx .cn.arw-hero{stroke:var(--accent-ink)}
    .cx .ah{fill:var(--muted);stroke:none}
    .cx .ah.arw-hero{fill:var(--accent-ink)}
  </style>

  <text class="h-title" x="20" y="34.45" font-size="17">Possible Pi camera setup</text>
  <text class="h-sub" x="20" y="56.4" font-size="11">Future work, not part of the current system</text>

  <svg class="cx" x="20" y="66.4" width="656" height="280" viewBox="0 0 656 280" aria-hidden="true" focusable="false">

    <rect x="0" y="0" width="656" height="92" rx="8" class="grp"/>
    <text x="12" y="17" font-size="10.5" text-anchor="start" class="t-mute m">Raspberry Pi Zero W: capture and filtering</text>

    <rect x="12" y="32" width="112" height="44" rx="5" class="nd nd-std"/>
    <text x="68" y="50.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Camera</text>
    <text x="68" y="64.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">fixed region</text>

    <path d="M125 54L136.5 54" class="cn arw"/>
    <polygon points="141,54 135.5,57.03 135.5,50.98" class="ah arw"/>

    <rect x="142" y="32" width="112" height="44" rx="5" class="nd nd-std"/>
    <text x="198" y="50.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Frame-change</text>
    <text x="198" y="64.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">detection</text>

    <path d="M255 54L266.5 54" class="cn arw"/>
    <polygon points="271,54 265.5,57.03 265.5,50.98" class="ah arw"/>

    <rect x="272" y="32" width="112" height="44" rx="5" class="nd nd-std"/>
    <text x="328" y="50.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Persistence</text>
    <text x="328" y="64.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">check</text>

    <path d="M385 54L396.5 54" class="cn arw"/>
    <polygon points="401,54 395.5,57.03 395.5,50.98" class="ah arw"/>

    <rect x="402" y="32" width="112" height="44" rx="5" class="nd nd-std"/>
    <text x="458" y="50.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Cooldown and</text>
    <text x="458" y="64.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">duplicate filter</text>

    <path d="M515 54L526.5 54" class="cn arw"/>
    <polygon points="531,54 525.5,57.03 525.5,50.98" class="ah arw"/>

    <rect x="532" y="32" width="112" height="44" rx="5" class="nd nd-std"/>
    <text x="588" y="50.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Candidate</text>
    <text x="588" y="64.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">image</text>

    <path d="M588 77L588 159.5" class="cn arw"/>
    <polygon points="588,164 584.98,158.5 591.03,158.5" class="ah arw"/>

    <rect x="0" y="124" width="460" height="156" rx="8" class="grp"/>
    <text x="12" y="141" font-size="10.5" text-anchor="start" class="t-mute m">Raspberry Pi Zero W: storage and local page</text>

    <rect x="12" y="164" width="190" height="96" rx="5" class="nd nd-std"/>
    <text x="107" y="187" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Local web page</text>
    <text x="107" y="202.5" font-size="10" text-anchor="middle" class="t-mute">observation history</text>
    <text x="107" y="215.5" font-size="10" text-anchor="middle" class="t-mute">species list</text>
    <text x="107" y="228.5" font-size="10" text-anchor="middle" class="t-mute">CSV export</text>
    <text x="107" y="241.5" font-size="10" text-anchor="middle" class="t-mute">ZIP and image export</text>

    <rect x="232" y="164" width="204" height="44" rx="5" class="nd nd-std"/>
    <text x="334" y="182.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">SQLite</text>
    <text x="334" y="196.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">observation record</text>

    <rect x="232" y="216" width="204" height="44" rx="5" class="nd nd-std"/>
    <text x="334" y="234.43" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Saved</text>
    <text x="334" y="248.93" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">image</text>

    <path d="M231 186L207.5 186" class="cn arw"/>
    <polygon points="203,186 208.5,182.98 208.5,189.03" class="ah arw"/>

    <rect x="506" y="160.25" width="150" height="51.5" rx="5" class="nd nd-hero"/>
    <text x="581" y="182.68" font-size="11.5" text-anchor="middle" font-weight="600" class="t-ink">Birdly API</text>
    <text x="581" y="197.91" font-size="10" text-anchor="middle" class="t-mute">Cloud Run, ONNX Runtime</text>

    <path d="M505 186L441.5 186" class="cn arw"/>
    <polygon points="437,186 442.5,182.98 442.5,189.03" class="ah arw"/>

  </svg>
</svg>